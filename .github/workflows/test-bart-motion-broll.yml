name: Test Bart motion-broll renderer

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/test-bart-motion-broll.yml"
      - "motion-test/**"

permissions:
  contents: read

concurrency:
  group: test-bart-motion-broll
  cancel-in-progress: false

jobs:
  renderer-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg git

      - name: Fetch Bart's upstream motion-graphics skill
        run: |
          git clone --depth 1 https://github.com/Barty-Bart/motion-graphics.git "$RUNNER_TEMP/bart-motion-graphics"
          echo "BART_SKILL=$RUNNER_TEMP/bart-motion-graphics/skills/motion-broll" >> "$GITHUB_ENV"
          git -C "$RUNNER_TEMP/bart-motion-graphics" rev-parse HEAD | tee "$RUNNER_TEMP/bart-upstream-commit.txt"

      - name: Install the dependencies using Bart's setup script
        run: |
          bash "$BART_SKILL/scripts/setup.sh" "$RUNNER_TEMP/bart-motion"
          # Ensure Chromium's Ubuntu system libraries are present on the hosted runner.
          "$RUNNER_TEMP/bart-motion/node_modules/.bin/playwright" install --with-deps chromium

      - name: Build Bart's real example clip
        run: |
          python3 "$BART_SKILL/engine/build.py" "$RUNNER_TEMP/bart-motion/dist" "$BART_SKILL/examples/opus-aoe2/01-opus-drop.html"
          mkdir -p "$RUNNER_TEMP/bart-motion/out" "$RUNNER_TEMP/bart-motion/work"

      - name: Render a short MP4 with Bart's renderer
        env:
          NODE_PATH: ${{ runner.temp }}/bart-motion/node_modules
        run: |
          node "$BART_SKILL/engine/render.js" "$RUNNER_TEMP/bart-motion/dist/01-opus-drop.html" "$RUNNER_TEMP/bart-motion/out/01-opus-drop.mp4" 24
          node "$BART_SKILL/engine/beats.js" "$RUNNER_TEMP/bart-motion/dist/01-opus-drop.html" "$RUNNER_TEMP/bart-motion/work/contact-sheet.png" 1 3 5.5
          test -s "$RUNNER_TEMP/bart-motion/out/01-opus-drop.mp4"
          test -s "$RUNNER_TEMP/bart-motion/work/contact-sheet.png"
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name,width,height,r_frame_rate -of json "$RUNNER_TEMP/bart-motion/out/01-opus-drop.mp4" | tee "$RUNNER_TEMP/bart-motion/work/mp4-probe.json"

      - name: Write test report
        env:
          NODE_PATH: ${{ runner.temp }}/bart-motion/node_modules
        run: |
          {
            echo "Bart motion-broll renderer smoke test"
            echo "Upstream commit: $(cat "$RUNNER_TEMP/bart-upstream-commit.txt")"
            echo "Node: $(node --version)"
            echo "npm: $(npm --version)"
            echo "Playwright: $(node -p "require('playwright/package.json').version")"
            echo "Python: $(python3 --version)"
            echo "FFmpeg: $(ffmpeg -version | head -n 1)"
            echo "Chromium: $("$RUNNER_TEMP/bart-motion/node_modules/.bin/playwright" --version)"
            echo "MP4 metadata:"
            cat "$RUNNER_TEMP/bart-motion/work/mp4-probe.json"
          } | tee "$RUNNER_TEMP/bart-motion/work/test-report.txt"

      - name: Upload MP4, contact sheet, and test report
        uses: actions/upload-artifact@v4
        with:
          name: bart-motion-broll-smoke-test
          path: |
            ${{ runner.temp }}/bart-motion/out/01-opus-drop.mp4
            ${{ runner.temp }}/bart-motion/work/contact-sheet.png
            ${{ runner.temp }}/bart-motion/work/mp4-probe.json
            ${{ runner.temp }}/bart-motion/work/test-report.txt
          if-no-files-found: error
          retention-days: 7
